# DNI GYM · Cloudflare Workers
# - Web estática (out/, generada por `npm run build`) + API en /api/* (worker/index.ts)
# - Base de datos D1 `dni-gym-db` (Europa occidental). El esquema se crea/migra solo (worker/db.ts).
# - Cuentas propias: correo + contraseña (PBKDF2) y Google OAuth directo, sesiones en D1.
# - Secretos (NUNCA aquí): GEMINI_API_KEY, TURNSTILE_SECRET, GOOGLE_CLIENT_SECRET → `wrangler secret put NOMBRE`.
name = "dni-gym"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# conserva variables añadidas desde el panel de Cloudflare (p. ej. GOOGLE_CLIENT_ID) al desplegar
keep_vars = true

[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = ["/api/*"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[[d1_databases]]
binding = "DB"
database_name = "dni-gym-db"
database_id = "5ac6b3cc-f614-4c9c-8c92-2f0ab0bcff31"

# Correo (Cloudflare Email Service): avisos al dueño gratis; a usuarios con EMAIL_USERS = "1" (Workers Paid)
[[send_email]]
name = "EMAIL"

# Tareas diarias: recordatorios, resumen semanal al dueño y limpieza (08:17 UTC)
[triggers]
crons = ["17 8 * * *"]

[vars]
ADMIN_EMAILS = "ibraguimova19@gmail.com"
SITE_URL = "https://dnigym.com"
OWNER_EMAIL = "ibraguimova19@gmail.com"
EMAIL_FROM = "DNI GYM <hola@dnigym.com>"
EMAIL_USERS = "0"
# hosts con la URL de retorno de Google registrada en Google Cloud (añade dnigym.com cuando la registres)
GOOGLE_HOSTS = "dni-gym.ibraguimova19.workers.dev"
# Gemini 2.5 Flash: modelo del nivel gratuito de Google AI Studio
GEMINI_MODEL = "gemini-2.5-flash"
AI_DAILY_LIMIT = "30"
# tope global diario de peticiones a Gemini para no salir del nivel gratuito
AI_GLOBAL_DAILY_LIMIT = "200"
# Google OAuth: ID de cliente (público). El secreto es el secret GOOGLE_CLIENT_SECRET.
GOOGLE_CLIENT_ID = "121689708991-cqrppb3f29gim7ifhjedhlolep27rp16.apps.googleusercontent.com"
# Cloudflare Turnstile (anti-bots): clave pública. La secreta es el secret TURNSTILE_SECRET.
TURNSTILE_SITE_KEY = "0x4AAAAAAF1VDqincCZsX_z6"

[observability]
enabled = true
